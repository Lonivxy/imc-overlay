name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows x64 application
        shell: pwsh
        run: |
          dotnet publish ./IMCBedwarsOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o "$env:RUNNER_TEMP/publish"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release
        shell: pwsh
        run: |
          $archive = "IMC-Overlay-$env:GITHUB_REF_NAME-win-x64.zip"
          $executable = Join-Path $env:RUNNER_TEMP 'publish/IMCBedwarsOverlay-CSharp.exe'
          if (-not (Test-Path -LiteralPath $executable)) { throw 'Published executable is missing.' }
          Compress-Archive -LiteralPath $executable -DestinationPath $archive -CompressionLevel Optimal
          "RELEASE_ASSET=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $options = @('--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--title', "IMC.RE Overlay $env:GITHUB_REF_NAME", '--generate-notes')
          if ($env:GITHUB_REF_NAME.Contains('-')) { $options += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME $env:RELEASE_ASSET @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
